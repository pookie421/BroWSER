[package]
name = "browser-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "BroWSER controlled-fixture offline renderer bootstrap"
repository = "https://github.com/pookie421/BroWSER"
publish = false

[lib]
name = "browser_engine"
path = "src/lib.rs"

[[bin]]
name = "browser-engine"
path = "src/main.rs"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
ab_glyph_rasterizer = "=0.1.10"
harfrust = "=0.13.3"
png = "=0.18.1"
skrifa = { version = "=0.46.2", default-features = false, features = ["std"] }
