name: Planning integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7; official tag resolved on 2026-11-16.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify planning contracts
        run: make check
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Fetch checksum-locked Rust dependencies
        run: cargo fetch --locked
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build and test offline
        run: cargo test --locked --offline --all-targets
      - name: Check Rust diagnostics
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Exercise the offline broker prototype
        run: cargo run --locked --offline --example m2_broker
      - name: Verify bootstrap artifacts and determinism
        run: python3 tools/run_m1_bootstrap.py --build --repeat 100
      - name: Retain bootstrap evidence
        if: always()
        # actions/upload-artifact v7.0.2; official tag verified 2026-11-20.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m1-bootstrap-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/m1/bootstrap-*/
          retention-days: 90
          if-no-files-found: warn
